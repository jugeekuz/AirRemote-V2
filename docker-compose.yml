services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airremote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airremote}
      POSTGRES_DB: ${POSTGRES_DB:-airremote}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: airremote-backend
    command: ['node', 'db/dist/migrate.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-airremote}:${POSTGRES_PASSWORD:-airremote}@db:5432/${POSTGRES_DB:-airremote}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: airremote-backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-airremote}:${POSTGRES_PASSWORD:-airremote}@db:5432/${POSTGRES_DB:-airremote}
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      PAIRING_CODE_SECRET: ${PAIRING_CODE_SECRET:?Set PAIRING_CODE_SECRET in .env}
      # The device listener stays off unless all three are set in .env; the
      # files themselves go in ./certs under these fixed names.
      DEVICE_PORT: 8443
      DEVICE_TLS_CERT_FILE: ${DEVICE_TLS_CERT_FILE:+/certs/device-server.crt}
      DEVICE_TLS_KEY_FILE: ${DEVICE_TLS_KEY_FILE:+/certs/device-server.key}
      DEVICE_TLS_CA_FILE: ${DEVICE_TLS_CA_FILE:+/certs/device-ca.crt}
    volumes:
      - ./certs:/certs:ro,z
    ports:
      - '${PORT:-3000}:3000'
      - '${DEVICE_PORT:-8443}:8443'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
